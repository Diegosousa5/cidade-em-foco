services:
  - type: web
    name: cidade-em-foco-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: cidade-em-foco-frontend
    runtime: static
    rootDir: frontend
    buildCommand: node build.mjs
    staticPublishPath: dist
    envVars:
      - key: API_BASE_URL
        sync: false
